<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Testes do cliente Slimes</title>
  </head>
  <body>
    <h1>Testes do cliente Slimes</h1>
    <div id="results"></div>
    <script type="module">
      import { run } from "./runner.js";
      await import("./protocol_test.js");
      await import("./strategy_test.js");
      await import("./resolve_test.js");
      await import("./parity_test.js");
      const { passed, failed } = await run();
      const p = document.createElement("p");
      p.textContent = `${passed} passaram, ${failed} falharam`;
      document.body.appendChild(p);
    </script>
  </body>
</html>
